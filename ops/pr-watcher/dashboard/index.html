<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pr-watcher · SpecterX KB</title>
<style>
/* ── reset + tokens ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #1c2128;
  --border:    #30363d;
  --text:      #e6edf3;
  --text-muted:#7d8590;
  --green:     #3fb950;
  --green-dim: #1a4024;
  --amber:     #d29922;
  --amber-dim: #3d2e0a;
  --red:       #f85149;
  --red-dim:   #3d0c09;
  --blue:      #58a6ff;
  --blue-dim:  #0c2233;
  --purple:    #bc8cff;
  --radius:    8px;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── layout ─────────────────────────────────────────────────────────────── */
.shell { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
  border-bottom: 1px solid var(--border); padding-bottom: 18px; }
header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
header .repo-link { font-size: 12px; color: var(--text-muted); margin-left: auto; }

/* ── hero ────────────────────────────────────────────────────────────────── */
.hero { border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px;
  display: flex; align-items: center; gap: 16px; border: 1px solid var(--border);
  transition: background .4s, border-color .4s; }
.hero.healthy  { background: var(--green-dim); border-color: var(--green); }
.hero.stale    { background: var(--amber-dim); border-color: var(--amber); }
.hero.down     { background: var(--red-dim);   border-color: var(--red);   }
.hero.loading  { background: var(--surface);   border-color: var(--border);}

.pulse { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.hero.healthy .pulse { background: var(--green); box-shadow: 0 0 0 0 var(--green);
  animation: pulse-green 2s infinite; }
.hero.stale   .pulse { background: var(--amber); }
.hero.down    .pulse { background: var(--red);   animation: pulse-red 1.2s infinite; }
.hero.loading .pulse { background: var(--text-muted); }
@keyframes pulse-green {
  0%   { box-shadow: 0 0 0 0 rgba(63,185,80,.7); }
  70%  { box-shadow: 0 0 0 10px rgba(63,185,80,0); }
  100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
}
@keyframes pulse-red {
  0%   { box-shadow: 0 0 0 0 rgba(248,81,73,.8); }
  70%  { box-shadow: 0 0 0 8px rgba(248,81,73,0); }
  100% { box-shadow: 0 0 0 0 rgba(248,81,73,0); }
}
.hero-text h2 { font-size: 20px; font-weight: 700; }
.hero.healthy  .hero-text h2 { color: var(--green); }
.hero.stale    .hero-text h2 { color: var(--amber); }
.hero.down     .hero-text h2 { color: var(--red);   }
.hero.loading  .hero-text h2 { color: var(--text-muted); }
.hero-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.hero-actions { margin-left: auto; flex-shrink: 0; }
.poll-btn { background: rgba(255,255,255,.07); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 7px 14px; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.poll-btn:hover:not(:disabled) { background: rgba(255,255,255,.13); border-color: var(--text-muted); }
.poll-btn:disabled { opacity: .45; cursor: default; }
.poll-btn.firing { border-color: var(--green); color: var(--green); }
.poll-btn.busy   { border-color: var(--amber); color: var(--amber); opacity: .75; }

/* failed comments panel */
.failed-panel { border-color: var(--amber) !important; }
.failed-list  { display: flex; flex-direction: column; gap: 10px; }
.failed-card  { background: var(--surface2); border: 1px solid var(--amber-dim);
  border-radius: 6px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; }
.failed-card-body { flex: 1; min-width: 0; }
.failed-pr    { font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
.failed-preview { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);
  white-space: pre-wrap; word-break: break-word; max-height: 3.6em; overflow: hidden; }
.failed-meta  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.retry-btn    { background: var(--amber-dim); border: 1px solid var(--amber); color: var(--amber);
  border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.retry-btn:hover:not(:disabled) { background: rgba(210,153,34,.25); }
.retry-btn:disabled { opacity: .5; cursor: default; }

/* ── widget grid ─────────────────────────────────────────────────────────── */
.widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px; margin-bottom: 24px; }
.widget { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; }
.widget-label { font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-muted); margin-bottom: 10px; }
.widget-value { font-size: 30px; font-weight: 700; color: var(--text); line-height: 1; }
.widget-sub   { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

/* activity widget: split into 3 mini counters */
.activity-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.activity-item { text-align: center; }
.activity-item .n { font-size: 26px; font-weight: 700; color: var(--green); }
.activity-item .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

/* sparkline widget */
.sparkline { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 8px; }
.spark-bar { flex: 1; border-radius: 2px 2px 0 0; min-width: 6px;
  transition: height .3s; }
.spark-bar.ok  { background: var(--green); opacity: .7; }
.spark-bar.err { background: var(--red); opacity: .9; }

/* active task widget */
.task-idle { color: var(--text-muted); font-style: italic; font-size: 13px; margin-top: 4px; }
.task-active { margin-top: 6px; }
.task-pr   { font-size: 15px; font-weight: 600; color: var(--blue); }
.task-step { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.task-elapsed { font-size: 12px; color: var(--amber); margin-top: 2px; }
.spinner { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* task live output panel */
.task-output-panel { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px; display: none; }
.task-output-panel.visible { display: block; }
.task-output-header { padding: 10px 18px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.task-output-scroll { height: 260px; overflow-y: auto; padding: 10px 18px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.task-output-line { white-space: pre-wrap; word-break: break-all; color: var(--text-muted); }
.task-output-line.step-line  { color: var(--blue); font-weight: 600; }
.task-output-line.tool-line  { color: var(--purple); }
.task-output-line.result-line { color: var(--green); }

/* ── panels ──────────────────────────────────────────────────────────────── */
.panel { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px; }
.panel-header { padding: 12px 18px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel-body { padding: 14px 18px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.badge-green  { background: var(--green-dim); color: var(--green); }
.badge-amber  { background: var(--amber-dim); color: var(--amber); }
.badge-red    { background: var(--red-dim);   color: var(--red);   }
.badge-blue   { background: var(--blue-dim);  color: var(--blue);  }
.badge-muted  { background: var(--surface2);  color: var(--text-muted); }

/* PR cards */
.pr-list { display: flex; flex-direction: column; gap: 10px; }
.pr-card { background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px;
  display: flex; align-items: center; gap: 12px; }
.pr-num  { font-weight: 700; color: var(--blue); white-space: nowrap; }
.pr-info { flex: 1; min-width: 0; }
.pr-branch { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
.pr-empty  { color: var(--text-muted); font-style: italic; font-size: 13px; }

/* error panel */
.error-panel { border-color: var(--red) !important; }
.error-msg  { font-family: var(--font-mono); font-size: 12px; color: var(--red);
  word-break: break-all; }
.error-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── log viewer ──────────────────────────────────────────────────────────── */
.log-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 18px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.log-toolbar input { flex: 1; min-width: 160px; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 12px;
  font-family: var(--font-mono); outline: none; }
.log-toolbar input:focus { border-color: var(--blue); }
.log-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.log-btn:hover { background: var(--border); color: var(--text); }
.log-btn.active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.log-scroll { height: 380px; overflow-y: auto; padding: 10px 18px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.7; }
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.ts    { color: var(--text-muted); }
.log-line.err   { color: var(--red); font-weight: 600; }
.log-line.ok    { color: var(--green); }
.log-line.step  { color: var(--blue); }
.log-line.poll  { color: var(--text); font-weight: 600; }
.log-line.warn  { color: var(--amber); }
.log-line.hidden { display: none; }
.log-load-more  { text-align: center; padding: 10px;
  border-top: 1px solid var(--border); }
.log-load-more button { background: none; border: 1px solid var(--border);
  color: var(--blue); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.log-load-more button:hover { background: var(--blue-dim); }

/* ── footer ──────────────────────────────────────────────────────────────── */
footer { margin-top: 32px; text-align: center; font-size: 11px; color: var(--text-muted);
  border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>

<script>
// ── state ──────────────────────────────────────────────────────────────────
let status = null, health = null;
let sparkHistory = [];   // [{ok: bool}]
let logLevel = 'all';
let autoScroll = true;
let taskStarted = null;
let taskTimer = null;

// ── fetch loop ──────────────────────────────────────────────────────────────
async function fetchAll() {
  try {
    const [sRes, hRes] = await Promise.all([
      fetch('status.json?_=' + Date.now()),
      fetch('health.json?_='  + Date.now()),
    ]);
    if (sRes.ok) status = await sRes.json();
    if (hRes.ok) health = await hRes.json();
    render();
  } catch(e) {
    console.warn('fetch error', e);
  }
}
setInterval(fetchAll, 5000);
fetchAll();

// ── helpers ─────────────────────────────────────────────────────────────────
function fmtUptime(isoStart) {
  if (!isoStart) return '—';
  const secs = Math.floor((Date.now() - new Date(isoStart)) / 1000);
  const d = Math.floor(secs / 86400);
  const h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m ${secs % 60}s`;
}

function fmtAgo(iso) {
  if (!iso) return '';
  const secs = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (secs < 60)  return `${secs}s ago`;
  if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
  return `${Math.floor(secs/3600)}h ago`;
}

function fmtCountdown(isoNext) {
  if (!isoNext) return '';
  const secs = Math.max(0, Math.floor((new Date(isoNext) - Date.now()) / 1000));
  const m = Math.floor(secs / 60), s = secs % 60;
  return `Next poll in ${m}:${String(s).padStart(2,'0')}`;
}

function fmtElapsed(startedAt) {
  if (!startedAt) return '';
  const secs = Math.floor((Date.now() - new Date(startedAt)) / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── main render ──────────────────────────────────────────────────────────────
function render() {
  if (!status && !health) return;
  renderHero();
  renderWidgets();
  updateTaskOutputPanel();
  renderPRs();
  renderFailedComments();
  renderError();
  renderLog();
  document.getElementById('footer-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString();
}

function renderHero() {
  const hero = document.getElementById('hero');
  const label = document.getElementById('hero-label');
  const sub   = document.getElementById('hero-sub');

  const active = health?.ActiveState === 'active';
  const staleThreshold = ((status?.daemon?.poll_interval || 300) * 2) * 1000;
  const lastPoll = status?.last_poll_at ? new Date(status.last_poll_at) : null;
  const stale = lastPoll && (Date.now() - lastPoll) > staleThreshold;

  hero.className = 'hero ' + (
    !health ? 'loading' :
    !active ? 'down' :
    stale   ? 'stale' :
              'healthy'
  );

  label.textContent =
    !health ? 'Connecting…' :
    !active ? '✕ DOWN' :
    stale   ? '⚠ STALE' :
              'HEALTHY';

  const parts = [];
  if (status?.last_poll_at)   parts.push('Last poll ' + fmtAgo(status.last_poll_at));
  if (status?.next_poll_at)   parts.push(fmtCountdown(status.next_poll_at));
  if (status?.poll_number)    parts.push('Poll #' + status.poll_number.toLocaleString());
  sub.textContent = parts.join(' · ');

  // Poll now button: grey out + tooltip when daemon is mid-task
  const btn = document.getElementById('poll-btn');
  if (btn && !btn.disabled) {
    const busy = !!status?.current_task;
    btn.classList.toggle('busy', busy);
    btn.title = busy
      ? 'Daemon is busy — poll will run after current task finishes'
      : 'Trigger an immediate poll';
  }
}

function renderWidgets() {
  // uptime
  const startTs = health?.ExecMainStartTimestamp
    ? health.ExecMainStartTimestamp.replace('n/a','').trim() : null;
  // systemd gives "Thu 2026-05-27 09:18:02 UTC" → parse it
  let startIso = null;
  if (startTs) {
    try { startIso = new Date(startTs).toISOString(); } catch(e) {}
  }
  document.getElementById('w-uptime').textContent = startIso ? fmtUptime(startIso) : (status?.daemon?.started_at ? fmtUptime(status.daemon.started_at) : '—');
  const nr = parseInt(health?.NRestarts || '0');
  document.getElementById('w-restarts').textContent =
    nr === 0 ? 'No restarts' : `${nr} restart${nr===1?'':'s'}`;

  // counters
  const c = status?.counters || {};
  document.getElementById('w-resolved').textContent  = c.comments_resolved  ?? '—';
  document.getElementById('w-triggered').textContent = c.articles_triggered ?? '—';
  document.getElementById('w-merges').textContent    = c.merges_handled     ?? '—';

  // active task
  const task = status?.current_task;
  const taskEl = document.getElementById('w-task');
  if (task) {
    taskEl.innerHTML = `
      <div class="task-active">
        <div class="task-pr"><span class="spinner">⟳</span> PR #${task.pr_number}</div>
        <div class="task-step">Step: ${escHtml(task.step || '…')}</div>
        <div class="task-elapsed" id="task-elapsed-val"></div>
      </div>`;
    taskStarted = task.started_at;
    clearInterval(taskTimer);
    taskTimer = setInterval(() => {
      const el = document.getElementById('task-elapsed-val');
      if (el && taskStarted) el.textContent = fmtElapsed(taskStarted);
    }, 1000);
  } else {
    clearInterval(taskTimer);
    taskStarted = null;
    taskEl.innerHTML = '<div class="task-idle">Idle</div>';
    const dur = status?.last_task_duration_secs;
    if (dur) taskEl.innerHTML += `<div class="widget-sub">Last task: ${dur}s</div>`;
  }

  // poll health sparkline + countdown
  document.getElementById('w-poll-num').textContent =
    status?.poll_number ? '#' + status.poll_number.toLocaleString() : '';

  // countdown ticks live
  clearInterval(window._cdTimer);
  window._cdTimer = setInterval(() => {
    const el = document.getElementById('w-countdown');
    if (el && status?.next_poll_at) el.textContent = fmtCountdown(status.next_poll_at);
  }, 1000);

  // build sparkline (last 20 polls represented by log lines containing "Poll #")
  const logLines = status?.recent_log || [];
  const pollLines = logLines.filter(l => l.includes('--- Poll #'));
  const errLines  = new Set(logLines
    .filter(l => l.includes('ERROR in poll loop'))
    .map(l => l.match(/Poll #(\d+)/)?.[1])
    .filter(Boolean));

  // derive bar heights from presence of errors near each poll
  const spark = document.getElementById('w-spark');
  spark.innerHTML = '';
  pollLines.slice(-20).forEach(pl => {
    const num = pl.match(/Poll #(\d+)/)?.[1];
    const hasErr = errLines.has(num);
    const bar = document.createElement('div');
    bar.className = 'spark-bar ' + (hasErr ? 'err' : 'ok');
    bar.style.height = hasErr ? '100%' : '60%';
    bar.title = 'Poll #' + (num || '?') + (hasErr ? ' — error' : ' — ok');
    spark.appendChild(bar);
  });
}

function renderPRs() {
  const prs  = status?.open_prs || [];
  const list = document.getElementById('pr-list');
  document.getElementById('pr-count').textContent = prs.length;
  if (!prs.length) {
    list.innerHTML = '<div class="pr-empty">No open PRs being watched</div>';
    return;
  }
  list.innerHTML = prs.map(pr => `
    <div class="pr-card">
      <span class="pr-num">
        <a href="https://github.com/guyhizkiau/kb_generation/pull/${pr.number}" target="_blank">
          #${pr.number}
        </a>
      </span>
      <div class="pr-info">
        <div class="pr-branch">${escHtml(pr.branch)}</div>
      </div>
      <span class="badge badge-blue">watching</span>
    </div>`).join('');
}

function renderFailedComments() {
  const failed = status?.failed_comments || [];
  const panel  = document.getElementById('failed-panel');
  if (!failed.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('failed-count').textContent = failed.length;
  document.getElementById('failed-list').innerHTML = failed.map(f => {
    const label = f.failure === 'STEP_TIMEOUT'  ? '⏱ Step timeout' :
                  f.failure === 'TOTAL_TIMEOUT' ? '⏱ Task timeout' : '✕ Error';
    return `
      <div class="failed-card" id="fc-${escHtml(f.comment_id)}">
        <div class="failed-card-body">
          <div class="failed-pr">PR #${f.pr_number} — ${label}</div>
          <div class="failed-preview">${escHtml(f.body_preview)}</div>
          <div class="failed-meta">Failed ${fmtAgo(f.failed_at)} · ${escHtml(f.comment_id)}</div>
        </div>
        <button class="retry-btn" onclick="retryComment('${escHtml(f.comment_id)}', this)">↺ Retry</button>
      </div>`;
  }).join('');
}

function renderError() {
  const err = status?.last_error;
  const panel = document.getElementById('err-panel');
  if (!err) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('err-msg').textContent  = err.message || '';
  document.getElementById('err-time').textContent = err.at ? 'at ' + err.at : '';
}

// ── log viewer ──────────────────────────────────────────────────────────────
let allLogLines = [];

function classifyLine(line) {
  if (/ERROR/i.test(line))              return 'err';
  if (/STEP:/i.test(line))             return 'step';
  if (/RESOLVED/i.test(line))         return 'ok';
  if (/--- Poll #/i.test(line))       return 'poll';
  if (/WARNING|WARN/i.test(line))     return 'warn';
  return 'ts';
}

function renderLog() {
  const incoming = status?.recent_log || [];
  // merge: keep existing allLogLines if they contain more (full log loaded)
  if (incoming.length > allLogLines.length ||
      (incoming.length && incoming[incoming.length-1] !== allLogLines[allLogLines.length-1])) {
    // update only if newer
    const last = allLogLines[allLogLines.length - 1];
    if (!allLogLines.length || incoming.some(l => !allLogLines.includes(l))) {
      // prepend existing lines that aren't in incoming, then replace tail
      allLogLines = incoming;
    }
  }
  document.getElementById('log-count').textContent = allLogLines.length + ' lines';
  paintLog();
}

function paintLog() {
  const filterRaw = document.getElementById('log-filter').value;
  let filterRe = null;
  try { if (filterRaw) filterRe = new RegExp(filterRaw, 'i'); } catch(e) {}

  const scroll = document.getElementById('log-scroll');
  const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 30;

  scroll.innerHTML = allLogLines.map(line => {
    const cls = classifyLine(line);
    const levelHide = logLevel === 'err'  && cls !== 'err'  ? ' hidden' :
                      logLevel === 'step' && cls !== 'step' ? ' hidden' : '';
    const filterHide = filterRe && !filterRe.test(line) ? ' hidden' : '';
    return `<div class="log-line ${cls}${levelHide}${filterHide}">${escHtml(line)}</div>`;
  }).join('');

  if (autoScroll && atBottom) scroll.scrollTop = scroll.scrollHeight;
}

function setLevel(level) {
  logLevel = level;
  ['all','err','step'].forEach(l => {
    document.getElementById('btn-' + l)?.classList.toggle('active', l === level);
  });
  paintLog();
}

function applyFilter() { paintLog(); }

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  const btn = document.getElementById('btn-as');
  btn.textContent = autoScroll ? 'Auto-scroll ✓' : 'Auto-scroll';
  btn.classList.toggle('active', autoScroll);
}

function copyLog() {
  const visible = allLogLines.filter((line, i) => {
    const el = document.getElementById('log-scroll')?.children[i];
    return el && !el.classList.contains('hidden');
  });
  navigator.clipboard.writeText(visible.join('\n')).catch(() => {});
}

async function loadFullLog() {
  try {
    const res = await fetch('/log?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    allLogLines = text.split('\n').filter(Boolean);
    document.getElementById('log-count').textContent = allLogLines.length + ' lines (full)';
    paintLog();
  } catch(e) {
    alert('Could not load full log: ' + e.message);
  }
}

// ── live task output ─────────────────────────────────────────────────────────
let taskOutputTimer = null;

function classifyTaskLine(line) {
  if (/^STEP:/i.test(line))                           return 'step-line';
  if (/^(Tool|Calling|Using|Running):/i.test(line))   return 'tool-line';
  if (/^(RESOLVED|NEEDS_HUMAN|Done|Complete)/i.test(line)) return 'result-line';
  return '';
}

async function fetchTaskOutput() {
  try {
    const res = await fetch('/task-log?_=' + Date.now());
    if (!res.ok) return;
    const text = await res.text();
    const lines = text.split('\n').filter(Boolean);
    const scroll = document.getElementById('task-output-scroll');
    const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 40;
    scroll.innerHTML = lines.map(l => {
      const cls = classifyTaskLine(l);
      return `<div class="task-output-line${cls ? ' ' + cls : ''}">${escHtml(l)}</div>`;
    }).join('');
    document.getElementById('task-output-lines').textContent = lines.length + ' lines';
    document.getElementById('task-output-updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    if (atBottom) scroll.scrollTop = scroll.scrollHeight;
  } catch(e) {}
}

function startTaskOutputPolling() {
  if (taskOutputTimer) return;
  fetchTaskOutput();
  taskOutputTimer = setInterval(fetchTaskOutput, 3000);
}

function stopTaskOutputPolling() {
  clearInterval(taskOutputTimer);
  taskOutputTimer = null;
}

function updateTaskOutputPanel() {
  const panel = document.getElementById('task-output-panel');
  if (status?.current_task) {
    panel.classList.add('visible');
    startTaskOutputPolling();
  } else {
    panel.classList.remove('visible');
    stopTaskOutputPolling();
  }
}

// ── retry failed comment ─────────────────────────────────────────────────────
async function retryComment(commentId, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/retry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comment_id: commentId }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    btn.textContent = '✓ Queued';
    // fade out the card after a moment
    const card = document.getElementById('fc-' + commentId);
    if (card) { card.style.opacity = '.4'; card.style.pointerEvents = 'none'; }
    setTimeout(fetchAll, 1500);
  } catch(e) {
    btn.textContent = '✕ Failed';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '↺ Retry'; }, 2000);
  }
}

// ── poll-now button ──────────────────────────────────────────────────────────
async function pollNow() {
  const btn  = document.getElementById('poll-btn');
  const icon = document.getElementById('poll-btn-icon');
  btn.disabled = true;
  btn.classList.add('firing');
  icon.style.display = 'inline-block';
  icon.style.animation = 'spin 0.7s linear infinite';
  try {
    const res = await fetch('/poll-now', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    icon.style.animation = '';
    icon.textContent = '✓';
    setTimeout(() => {
      icon.textContent = '↻';
      btn.classList.remove('firing');
      btn.disabled = false;
    }, 2000);
    // refresh status sooner
    setTimeout(fetchAll, 1500);
  } catch(e) {
    icon.style.animation = '';
    icon.textContent = '✕';
    btn.classList.remove('firing');
    setTimeout(() => { icon.textContent = '↻'; btn.disabled = false; }, 2000);
  }
}

// live countdown in hero-sub every second
setInterval(() => {
  const sub = document.getElementById('hero-sub');
  if (!status || !sub) return;
  const parts = [];
  if (status.last_poll_at) parts.push('Last poll ' + fmtAgo(status.last_poll_at));
  if (status.next_poll_at) parts.push(fmtCountdown(status.next_poll_at));
  if (status.poll_number)  parts.push('Poll #' + status.poll_number.toLocaleString());
  sub.textContent = parts.join(' · ');
}, 1000);
</script>
