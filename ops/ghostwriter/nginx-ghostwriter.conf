# Ghostwriter SPA — add these location blocks to the existing nginx server {}
# block on the pr-watcher VM (18.192.122.48, port 80).

# Serve Ghostwriter SPA (built to /home/ubuntu/pr-watcher-web/ghostwriter/)
location /ghostwriter/ {
    alias /home/ubuntu/pr-watcher-web/ghostwriter/;
    try_files $uri $uri/ /ghostwriter/index.html;
}

# API proxy → control plane on :9191
location /api/ {
    proxy_pass         http://127.0.0.1:9191/api/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
}

location /poll-now {
    proxy_pass         http://127.0.0.1:9191/poll-now;
    proxy_set_header   Host $host;
}

location /retry {
    proxy_pass         http://127.0.0.1:9191/retry;
    proxy_set_header   Host $host;
}

# Static annotation libraries (RecogitoJS + Annotorious bundles)
# Place bundles at /home/ubuntu/pr-watcher-web/static/
location /static/ {
    alias          /home/ubuntu/pr-watcher-web/static/;
    expires        7d;
    add_header     Cache-Control "public, immutable";
}
